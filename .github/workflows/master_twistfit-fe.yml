# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Next.js app to Azure Web App - twistfit-fe

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare standalone deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copy Next.js standalone server
          cp -r .next/standalone/. deploy/

          # Copy static assets
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          # Copy public assets if exists
          if [ -d public ]; then
            cp -r public deploy/public
          fi

      - name: Inspect deployment package
        run: |
          echo "======================================"
          echo "Deployment root"
          echo "======================================"
          ls -lah deploy

          echo ""
          echo "======================================"
          echo ".next directory"
          echo "======================================"
          find deploy/.next -maxdepth 3 -type f | head -150

          echo ""
          echo "======================================"
          echo "server.js"
          echo "======================================"
          if [ -f deploy/server.js ]; then
            echo "server.js OK"
          else
            echo "ERROR: server.js NOT FOUND"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "package.json"
          echo "======================================"
          if [ -f deploy/package.json ]; then
            cat deploy/package.json
          else
            echo "WARNING: package.json NOT FOUND"
          fi

          echo ""
          echo "======================================"
          echo "Deployment package size"
          echo "======================================"
          du -sh deploy

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          include-hidden-files: true


  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Inspect downloaded artifact
        run: |
          echo "======================================"
          echo "Downloaded files"
          echo "======================================"
          ls -lah

          echo ""
          echo "======================================"
          echo "server.js"
          echo "======================================"
          test -f server.js && echo "server.js OK" || {
            echo "ERROR: server.js NOT FOUND"
            exit 1
          }

          echo ""
          echo "======================================"
          echo ".next"
          echo "======================================"
          test -d .next && echo ".next OK" || {
            echo "ERROR: .next NOT FOUND"
            exit 1
          }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_64CA8B9E44224BF084BEE386C4B4360F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_079084694E1841FE940016A9AF2BB02A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F4C1853B4963496892539D78D74B66A6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: twistfit-fe
          slot-name: Production
          package: .
